<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Antony Carrasco - Analista de sistemas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1730"/>
      <stop offset="1" stop-color="#060912"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE0F7"/>
      <stop offset="0.5" stop-color="#6D6AF3"/>
      <stop offset="1" stop-color="#B72CD6"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="330" y="172" width="182" height="168" fill="#000"/>
    </mask>
    <clipPath id="c0"><rect x="395" y="190" width="0" height="60"><animate attributeName="width" values="0;700;700;0;0" keyTimes="0;0.06;0.28;0.31;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c1"><rect x="395" y="190" width="0" height="60"><animate attributeName="width" values="0;700;700;0;0" keyTimes="0;0.06;0.28;0.31;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="395" y="190" width="0" height="60"><animate attributeName="width" values="0;700;700;0;0" keyTimes="0;0.06;0.28;0.31;1" dur="12s" begin="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- nodos flotando -->
  <g fill="#5EE0F7">
    <circle cx="980" cy="70" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="130" r="2.5" fill="#B72CD6"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="240" r="3.5" fill="#6D6AF3"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="275" r="2" fill="#FBBF24"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="60" r="2" fill="#5EE0F7"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#6D6AF3" stroke-width="1" opacity="0.35">
    <line x1="980" y1="70" x2="1090" y2="130"/>
    <line x1="1090" y1="130" x2="1020" y2="240"/>
    <line x1="1020" y1="240" x2="880" y2="275"/>
    <line x1="1090" y1="130" x2="1150" y2="60"/>
  </g>

  <!-- logo -->
  <g transform="translate(40 12) scale(0.58)">
    <g transform="translate(12 0)">
      <g mask="url(#gap)" stroke-linejoin="round" stroke-width="0.6">
        <polygon points="147.72,68.5 39.44,256 92.56,256 174.28,114.5" fill="#5EE0F7" stroke="#5EE0F7"/>
        <polygon points="364.28,68.5 147.72,68.5 174.28,114.5 337.72,114.5" fill="#3FB2F6" stroke="#3FB2F6"/>
        <polygon points="472.56,256 364.28,68.5 337.72,114.5 419.44,256" fill="#6D6AF3" stroke="#6D6AF3"/>
        <polygon points="39.44,256 147.72,443.5 174.28,397.5 92.56,256" fill="#4A8AF4" stroke="#4A8AF4"/>
        <polygon points="147.72,443.5 364.28,443.5 337.72,397.5 174.28,397.5" fill="#7A4FE8" stroke="#7A4FE8"/>
        <polygon points="364.28,443.5 472.56,256 419.44,256 337.72,397.5" fill="#B72CD6" stroke="#B72CD6"/>
      </g>
      <path fill="#F8FAFC" fill-rule="evenodd"
            d="M256 150 L344 340 L168 340 Z M256 244 L279.8 296 L232.2 296 Z M220.25 322 L291.75 322 L300 340 L212 340 Z"/>
    </g>
  </g>

  <!-- nombre -->
  <text x="370" y="150" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" fill="url(#name)" letter-spacing="-1">Antony Carrasco</text>

  <!-- prompt + frases que se escriben -->
  <text x="370" y="232" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="34" fill="#FBBF24" font-weight="700">&gt;</text>
  <g font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="34" fill="#5EE0F7">
    <text x="405" y="232" clip-path="url(#c0)">Analista de sistemas</text>
    <text x="405" y="232" clip-path="url(#c1)">Análisis ágil &amp; pruebas</text>
    <text x="405" y="232" clip-path="url(#c2)">Desarrollo C# / .NET</text>
  </g>

  <!-- línea de acento animada -->
  <rect x="370" y="268" width="420" height="5" rx="2.5" fill="url(#bar)">
    <animate attributeName="width" values="120;420;120" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
